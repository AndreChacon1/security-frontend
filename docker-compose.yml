services:
  backend:
    build: ../security-api
    container_name: security-api
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY}
    restart: unless-stopped

  frontend:
    build: .
    container_name: security-frontend
    ports:
      - "8080:80"
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped
